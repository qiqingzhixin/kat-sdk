name: SDK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip wheel --wheel-dir dist ".[test]"
      - run: python -m pip install --no-index --find-links dist "kat-sdk[test]==0.1.0"
      - run: python -m pip check
      - run: python -I -B -m pytest tests

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Verify release version
        run: python -c 'import os, tomllib; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + version'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Publish wheel and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
          gh release create "$RELEASE_TAG" *.whl SHA256SUMS --verify-tag --title "kat-sdk $RELEASE_TAG" --notes "提供可通过 pip 安装的 SDK wheel；SHA256SUMS 用于校验下载产物。"
