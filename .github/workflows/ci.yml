name: SDK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip wheel --wheel-dir dist ".[test]"
      - run: python -m pip install --no-index --find-links dist "kat-sdk[test]==0.1.0"
      - run: python -m pip check
      - run: python -I -B -m pytest tests
