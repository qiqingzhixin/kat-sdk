[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kat-sdk"
version = "0.1.0"
description = "KAT Workflow authoring API and data provider toolkit"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["datafusion==54.0.0", "pyarrow==24.0.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.urls]
Repository = "https://github.com/qiqingzhixin/kat-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kat.dataprovider" = ["knowledge/providers/*.md"]
